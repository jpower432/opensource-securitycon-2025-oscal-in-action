metadata:
  id: CNSCC
  title: Cloud Native Security Controls Catalog
  version: "1.0"
  description: |
    The controls catalog ensures the usability of CNCF deliverables by GRC professionals and Auditors of Cloud Native systems. 
    The primary goal is to support quickly identifying the controls status of cloud-native environments, and methods to share the output of those assessments in machine readable formats (OSCAL, JSON, etc.). 
    These outputs should also map to existing frameworks and regulations (CSA, NIST, FedRAMP, SOX, GDPR, etc.), and provide guidance to properly validate and verify administrative and technical controls.
  applicability-categories:
    - id: public
      title: Public Data
      description: |
        Information that is intended for public release and poses no risk if disclosed.
        Examples include marketing materials, public documentation, and open source code.
    - id: internal
      title: Internal Data
      description: |
        Information that is intended for internal use only and could cause minor harm if disclosed.
        Examples include internal documentation, non-sensitive business processes, and general operational data.
    - id: confidential
      title: Confidential Data
      description: |
        Information that could cause significant harm to the organization if disclosed.
        Examples include business strategies, financial data, customer information, and proprietary technology.
    - id: restricted
      title: Restricted Data
      description: |
        Information that could cause severe harm to the organization or individuals if disclosed.
        Examples include personally identifiable information (PII), protected health information (PHI),
        financial records, and national security information.
  mapping-references:
    - id: 800-53
      title: NIST Special Publication 800-53 - Cybersecurity Supply Chain Risk Management Practices for Systems and Organizations
      version: r5
      url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf
      description: |
        This publication provides a catalog of security and privacy controls for information systems and organizations to protect 
        organizational operations and assets, individuals, other organizations, and the Nation from a diverse set of threats and risks, 
        including hostile attacks, human errors, natural disasters, structural failures, foreign intelligence entities, and privacy risks.
    - id: 800-161
      title: NIST Special Publication 800-161 - Cybersecurity Supply Chain Risk Management Practices for Systems and Organizations
      version: "1.1"
      url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-161r1.pdf
      description: |
        This publication provides guidance for federal agencies and other organizations to identify, assess, and mitigate cybersecurity 
        risks throughout the supply chain. It establishes a foundation for managing cybersecurity supply chain risks within and across 
        organizations and provides guidance on how to identify, assess, and mitigate cybersecurity risks throughout the supply chain.
    - id: PCIDSS
      title: Payment Card Industry Data Security Standard
      version: "4.0"
      url: https://docs-prv.pcisecuritystandards.org/PCI%20DSS/Standard/PCI-DSS-v4_0_1.pdf
      description: |
        The Payment Card Industry Data Security Standard (PCI DSS) is a set of security standards designed to ensure that all companies 
        that accept, process, store or transmit credit card information maintain a secure environment. PCI DSS applies to all entities 
        involved in payment card processing, including merchants, processors, acquirers, issuers, and service providers.
control-families:
  - title: Securing the Source Code
    id: SSC
    description: |
      Controls for securing source code repositories, 
      including access management, code review processes, and 
      protection of sensitive information in source code.
    controls:
      - id: CNSCC-SSC-09
        title: Enforce Independent Review for Production Code Changes
        objective: |
          Ensure a independent peer-review process is 
          completed for all production code changes.
        guideline-mappings:
          - reference-id: 800-53
            entries:
              - reference-id: SA-11(4)
                strength: 7
          - reference-id: 800-161
            entries:
              - reference-id: AC-5
                strength: 6
              - reference-id: SA-15
                strength: 7
          - reference-id: PCIDSS
            entries:
              - reference-id: 6.2.3.1
                strength: 8
        assessment-requirements:
          - id: CNSCC-SSC-09.01
            text: |
              All code destined for production must undergo a manual review.
              At least two reviewers with equal or greater expertise should 
              review and approve the changes. The author(s) of the code may not 
              also be the final approver of the associated merge/pull request.
            applicability:
              - public
              - internal
              - confidential
              - restricted
            recommendation: |
              Require independent peer review and approval via an automated 
              Source Code Management (SCM) tool (e.g., Pull Request/Merge Request process).

