metadata:
  id: "org-policy-001"
  title: "Organization Policy for Open Source Projects"
  objective: "Ensure secure software development practices and mitigate risks in open-source projects"
  version: "1.5.0"
  last-modified: "2025-10-06"
  organization-id: "org-67890"
  author-notes: "Updated to align with SSDF recommendations"
  mapping-references:
    - id: 800-53
      title: "NIST Special Publication 800-53"
      version: "Rev. 5"
      description: "Security and Privacy Controls for Federal Information Systems"
      url: "https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final"
    - id: 800-161
      title: "NIST Special Publication 800-161"
      version: "1.1"
      description: "Cybersecurity Supply Chain Risk Management Practices for Systems and Organizations"
      url: "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-161r1.pdf"
    - id: PCIDSS
      title: "Payment Card Industry Data Security Standard"
      version: "4.0"
      description: "Security standards for companies that accept, process, store or transmit credit card information"
      url: "https://www.pcisecuritystandards.org/document_library/"
    - id: CNSCC
      title: Cloud Native Security Controls Catalog
      version: "1.0"
      url: https://github.com/cloud-native-security-controls/controls-catalog/blob/main/controls/controls_catalog.csv
      description: |
        The controls catalog ensures the usability of CNCF deliverables by GRC professionals and Auditors of Cloud Native systems. 
        The primary goal is to support quickly identifying the controls status of cloud-native environments, and 
        methods to share the output of those assessments in machine readable formats (OSCAL, JSON, etc.).
        These outputs should also map to existing frameworks and regulations (CSA, NIST, FedRAMP, SOX, GDPR, etc.), 
        and provide guidance to properly validate and verify administrative and technical controls.

  contacts:
    author:
      name: "Software Security Team"
      primary: true
      affiliation: "Product Security"
      email: "security@company.com"
    responsible:
      - name: "Chief Information Security Officer"
        primary: true
        affiliation: "Information Security"
        email: "ciso@company.com"
    accountable:
      - name: "VP of Engineering"
        primary: true
        affiliation: "Engineering"
        email: "vp-eng@company.com"

implementation-plan:
  evaluation:
    start: 2025-11-01T16:02:00.000000000Z
    notes: |
      This is setting when my policy will take effect.
  evaluation-points: ["runtime-adhoc"]
  enforcement:
    start: 2025-11-07T16:02:00.000000000Z
    notes:
      This is setting when my policy will be enforced.
  enforcement-methods: ["Manual Remediation"]

scope:
  boundaries:
    - "United States"
  technologies:
    - "Cloud Computing"
  providers:
    - "Amazon Web Services"
    - "GitHub"


guidance-references:
  - reference-id: "800-53"
    in-scope:
      boundaries: ["United States"]
  - reference-id: "800-161"
    in-scope:
      boundaries: ["United States"]
  - reference-id: "PCIDSS"
    in-scope:
      boundaries: ["Global"]
      technologies: ["Financial Services"]

control-references:
  - reference-id: "CNSCC"
    in-scope:
      technologies: ["Source Code Management Platform"]
      providers: ["GitHub"]
    assessment-requirement-modifications:
      - target-id: "CNSCC-SSC-09.01"
        modification-type: "reduce-strictness"
        modification-rationale: |
          For projects with limited maintainer resources (two or fewer maintainers), implement a modified 
          peer review process that ensures code quality and security while remaining practical for small teams.
        text: |
          At least one qualified reviewer with equal or greater technical expertise than the author must 
          thoroughly review and approve all pull requests before merging to protected branches. The reviewer 
          must not be the same person as the author to maintain separation of duties and prevent self-approval 
          of potentially problematic changes.
        recommendation: |
          Configure your source code management platform (e.g., GitHub, GitLab) to enforce branch protection 
          rules that require at least one reviewer approval for all pull requests targeting main or release 
          branches.